[package]
name = "voxelot"
version = "0.1.0"
edition = "2021"

[features]
default = []
viewer-debug = []
mesh-debug = []
test-block-world = []
# Optional profiling features
cpu-profiling = []
gpu-profiling = ["wgpu-profiler"]

[dependencies]
croaring = "2"
rustc-hash = "2.1"
rayon = "1.10"
glam = "0.30"
serde_json = "1"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
noise = "0.8"

# wgpu-based viewer (desktop)
wgpu = "27.0.1"
winit = "0.30.12"
pollster = "0.4.0"
futures = "0.3"
bytemuck = { version = "1.13", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4"
sysinfo = "0.29"
crossbeam-channel = "0.5"
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
zstd = "0.13.3"
image = { version = "0.25", features = ["hdr"] }
# Optional profiling dependencies
wgpu-profiler = { version = "0.25.0", optional = true }

# egui UI
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"

[dev-dependencies]
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
libc = "0.2"
raw-window-handle = "0.6"

#[profile.release]
# Keep debug symbols for profiling builds by default (useful for profiling tools).
#debug = true
# Optimize for speed
#opt-level = 3
# Whole-program optimization; "thin" gives a good trade-off between
# performance and link time. Use "fat" for maximum runtime throughput.
#lto = "thin"
# Fewer codegen units improves optimization at the cost of parallel compile time
#codegen-units = 1
# Abort on panic to reduce binary size and avoid unwinding overhead
#panic = "abort"
