[package]
name = "voxelot"
version = "0.1.0"
edition = "2021"

[features]
default = []
viewer-debug = []
mesh-debug = []
test-block-world = []
# Optional profiling features
cpu-profiling = []
gpu-profiling = []
# Minimal runtime counters for overlays & headless builds
perf-counters = []

[dependencies]
croaring = "2.5.2"
rustc-hash = "2.1"
rayon = "1.10"
glam = "0.31.0"
serde_json = "1.0.149"
rand = "0.8"
clap = { version = "4.5.54", features = ["derive"] }
noise = "0.9.0"
# wgpu-based viewer (desktop)
wgpu = "29.0.3"
#windows = "0.62"
winit = "0.30.12"

pollster = "0.4.0"
futures = "0.3"
bytemuck = { version = "1.13", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.29"
sysinfo = "0.29"
crossbeam-channel = "0.5"
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
zstd = "0.13.3"
image = { version = "0.25", features = ["hdr"] }
half = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Force consistent `windows` crate version for Windows builds only.
windows = "0.62.2"


[dev-dependencies]
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
libc = "0.2"
raw-window-handle = "0.6"



[profile.release]
# Optimize for speed (prefer performance over size) and enable cross-crate optimizations.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Move debug info out of the binary (macOS will produce .dSYM bundles)
split-debuginfo = "unpacked"

# Note: these settings favor runtime performance. Build times may increase due
# to LTO and single codegen unit.
