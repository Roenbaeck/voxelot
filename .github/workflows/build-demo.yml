name: Build demo packages

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build & package demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: |
          cargo build --release --bin voxelot

      - name: Strip binary (reduce size)
        run: |
          set -euo pipefail
          echo "Attempting to strip binary (best-effort)..."
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            xcrun strip -x target/release/voxelot || true
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            if command -v llvm-strip >/dev/null 2>&1; then
              llvm-strip target/release/voxelot.exe || true
            elif command -v strip >/dev/null 2>&1; then
              strip --strip-all target/release/voxelot.exe || true
            else
              echo "No strip tool available on Windows runner; skipping strip"
            fi
          else
            strip --strip-all target/release/voxelot || true
          fi

      - name: Show binary sizes
        run: |
          echo "Binary sizes after strip (if applied):"
          du -h target/release/voxelot* || true
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "Checking for .dSYM bundles:"
            ls -la target/release/*.dSYM || true
          fi

      - name: macOS code sign & notarize (optional)
        if: ${{ matrix.os == 'macos-latest' && secrets.MACOS_SIGNING_CERT != '' && secrets.APPLE_API_KEY_ID != '' }}
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_ID: ${{ secrets.MACOS_SIGNING_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Decoding signing certificate..."
          echo "$MACOS_SIGNING_CERT" | base64 --decode > signing_identity.p12
          echo "$APPLE_API_KEY" | base64 --decode > AuthKey.p8

          KEYCHAIN="build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security import signing_identity.p12 -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild || true
          security list-keychains -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

          echo "Codesigning binary..."
          codesign --options runtime --timestamp --sign "$MACOS_SIGNING_ID" target/release/voxelot

          echo "Submitting to notarization (notarytool)..."
          xcrun notarytool submit target/release/voxelot --wait --key AuthKey.p8 --issuer "$APPLE_API_ISSUER_ID" --key-id "$APPLE_API_KEY_ID" || true

          echo "Stapling notarization ticket..."
          xcrun stapler staple target/release/voxelot || true

      - name: Make packaging script executable
        run: chmod +x scripts/package-demo.sh

      - name: Package demo
        run: |
          BIN="target/release/voxelot"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN="target/release/voxelot.exe"
          fi
          ./scripts/package-demo.sh "$BIN" "demo-${{ matrix.os }}.zip"

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}
          path: demo-${{ matrix.os }}.zip

  publish_release:
    name: Publish release (on tag or release creation)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'release' && github.event.action == 'created')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download demo artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./downloaded

      - name: Set upload_url from release event
        id: set_upload_url
        if: github.event_name == 'release' && github.event.action == 'created'
        run: |
          echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (if needed)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated demo build"
          draft: false
          prerelease: false

      - name: Upload demo artifacts to Release (ubuntu)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url || steps.set_upload_url.outputs.upload_url }}
          asset_path: ./downloaded/demo-ubuntu-latest.zip
          asset_name: demo-ubuntu-latest.zip
          asset_content_type: application/zip

      - name: Upload demo macOS asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url || steps.set_upload_url.outputs.upload_url }}
          asset_path: ./downloaded/demo-macos-latest.zip
          asset_name: demo-macos-latest.zip
          asset_content_type: application/zip

      - name: Upload demo Windows asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url || steps.set_upload_url.outputs.upload_url }}
          asset_path: ./downloaded/demo-windows-latest.zip
          asset_name: demo-windows-latest.zip
          asset_content_type: application/zip
