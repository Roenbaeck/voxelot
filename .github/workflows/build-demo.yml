name: Build demo packages

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build & package demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: |
          cargo build --release --bin voxelot

      - name: Strip binary (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          set -euo pipefail
          echo "Stripping macOS binary..."
          xcrun strip -x target/release/voxelot || true

      - name: Strip binary (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          set -euo pipefail
          echo "Stripping Windows binary..."
          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip target/release/voxelot.exe || true
          elif command -v strip >/dev/null 2>&1; then
            strip --strip-all target/release/voxelot.exe || true
          else
            echo "No strip tool available on Windows runner; skipping strip"
          fi
        shell: bash

      - name: Strip binary (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          set -euo pipefail
          echo "Stripping Linux binary..."
          strip --strip-all target/release/voxelot || true

      - name: Show binary sizes
        run: |
          echo "Binary sizes after strip (if applied):"
          du -h target/release/*voxelot* || true
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "Checking for .dSYM bundles:"
            ls -la target/release/*.dSYM || true
          fi
        shell: bash

      - name: macOS code sign & notarize (disabled)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          echo "macOS signing is currently disabled in CI due to workflow validation constraints."
          echo "To re-enable signing, see demo/RELEASE_SIGNING.md for a safe in-step secrets check pattern."

      - name: Make packaging script executable
        run: |
          # Remove CRLF line endings if present (prevents script failure on Windows runners)
          # Using perl for cross-platform compatibility between BSD (macOS) and GNU (Linux/Windows)
          perl -pi -e 's/\r//g' scripts/package-demo.sh
          chmod +x scripts/package-demo.sh
        shell: bash

      - name: Package demo
        run: |
          BIN="target/release/voxelot"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN="target/release/voxelot.exe"
          fi
          # Use bash explicitly to avoid shebang issues on Windows runners (CRLF)
          bash ./scripts/package-demo.sh "$BIN" "demo-${{ matrix.os }}.zip"
        shell: bash

      - name: "Windows: Dump environment & workspace (always)"
        if: matrix.os == 'windows-latest' && always()
        shell: pwsh
        run: |
          Write-Host "=== Environment Variables ==="
          Get-ChildItem Env: | Sort-Object Name | Out-File env.txt
          Write-Host "=== Disk usage ==="
          Get-PSDrive C | Select-Object Used, Free | Out-File disk_usage.txt
          Write-Host "=== Files (top level) ==="
          Get-ChildItem -Recurse -Depth 2 | Select-Object FullName, Length | Out-File files.txt
          Write-Host "=== Cargo Lock ==="
          if (Test-Path "Cargo.lock") { Get-Content "Cargo.lock" -Head 100 | Out-File locks.txt }

      - name: "Windows: Upload debug artifact (always)"
        if: matrix.os == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-${{ github.run_id }}
          path: |
            env.txt
            disk_usage.txt
            files.txt
            locks.txt

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}
          path: demo-${{ matrix.os }}.zip

  publish_release:
    name: Publish release (on tag or release creation)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'release' && github.event.action == 'created')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download demo artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded

      - name: Path debug
        run: ls -R ./downloaded

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./downloaded/demo-ubuntu-latest/demo-ubuntu-latest.zip
            ./downloaded/demo-macos-latest/demo-macos-latest.zip
            ./downloaded/demo-windows-latest/demo-windows-latest.zip
          tag_name: ${{ github.ref_name }}
          body: "Automated demo build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# (End of file - removed old create-release/upload-release-asset steps)
